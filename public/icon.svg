<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="8"/>

  <!-- Glowing Sparkle Halo -->
  <circle cx="256" cy="256" r="180" fill="url(#primaryGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Presentation Canvas Stack -->
  <g transform="translate(106, 126)">
    <!-- Back Slide Layer -->
    <rect x="50" y="0" width="250" height="170" rx="20" fill="#27272a" opacity="0.5"/>
    
    <!-- Middle Slide Layer -->
    <rect x="25" y="30" width="250" height="170" rx="20" fill="#3f3f46" opacity="0.8"/>

    <!-- Front Primary Active Slide -->
    <rect x="0" y="60" width="250" height="170" rx="20" fill="url(#primaryGrad)" shadow-soft-lg="true"/>

    <!-- Inner Slide Content Lines -->
    <rect x="28" y="95" width="90" height="12" rx="6" fill="#ffffff" opacity="0.9"/>
    <rect x="28" y="118" width="130" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
    <rect x="28" y="134" width="110" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
    <rect x="28" y="150" width="80" height="8" rx="4" fill="#ffffff" opacity="0.7"/>

    <!-- Floating AI Sparkle Badge -->
    <circle cx="195" cy="135" r="32" fill="url(#accentGrad)"/>
    <path d="M195,115 L198,130 L213,135 L198,140 L195,155 L192,140 L177,135 L192,130 Z" fill="#ffffff"/>
  </g>
</svg>
